[build]
  functions = "api"
  
# 在静态 CDN 层直接返回 403 阻断，根本不触发 functions 目录下的代码
[[redirects]]
  from = "/api"
  to = "/403.html"
  status = 403
  force = true
  headers = { Host = "eloquent-starburst-2a52a5.netlify.app" }

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/index"
  status = 200
